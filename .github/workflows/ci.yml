name: CI

on:
  push:
    branches: [main, 'vibe/*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests d'intégration (npm test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lancer les tests (81 assertions, 2 joueurs simulés via SSE)
        run: npm test
